databases:
  - name: stt-db
    plan: free
    databaseName: stt
    user: stt

services:
  - type: web
    name: speech-to-text
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: stt-db
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_API_KEY
        sync: false
